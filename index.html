<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mClick</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    body {
      width: 260px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      user-select: none;
    }
    header {
      padding: 16px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-container { display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 30px; height: 30px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; }
    .logo-text { font-weight: 900; font-size: 15px; letter-spacing: -0.5px; }

    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
    .slider-toggle:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider-toggle { background-color: var(--primary); }
    input:checked + .slider-toggle:before { transform: translateX(18px); }

    main { padding: 16px; }
    .status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .status-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; }
    #statusText { font-size: 13px; font-weight: 900; color: var(--primary); }

    .preset-label { font-size: 10px; font-weight: 900; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin: 4px 0 8px; }
    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
    .preset-chip {
      position: relative; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: white; font-size: 10px; font-weight: 800; cursor: pointer; text-align: left;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .preset-chip:hover { border-color: var(--primary); background: #eef2ff; }
    .preset-chip.active { border-color: var(--primary); background: #eef2ff; box-shadow: 0 0 0 2px var(--primary); color: var(--primary); }
    @keyframes chip-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .preset-chip.just-applied { animation: chip-pop 0.35s ease; }
    .preset-status { font-size: 10px; font-weight: 700; color: #64748b; margin-bottom: 12px; min-height: 13px; }
    .preset-status.applied { color: #16a34a; }

    button.btn-main {
      width: 100%; padding: 11px; border-radius: 8px; border: none;
      font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;
      cursor: pointer; background: var(--primary); color: white; transition: 0.2s;
    }
    button.btn-main:hover { background: #4338ca; }

    .hint { margin-top: 10px; text-align: center; font-size: 10px; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <div class="logo-icon">m</div>
      <div class="logo-text">mClick</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="isEnabled">
      <span class="slider-toggle"></span>
    </label>
  </header>

  <main>
    <div class="status-row">
      <span class="status-label">Status</span>
      <span id="statusText">Active</span>
    </div>

    <div class="preset-label">Quick Presets</div>
    <div class="preset-grid" id="presetGrid"></div>
    <div class="preset-status" id="presetStatus"></div>

    <button class="btn-main" id="openOptions">Open Full Settings</button>
    <div class="hint">Ctrl+Shift+H to toggle anywhere</div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
